name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar o app (baixa as bibliotecas para funcionar offline)
        run: |
          mkdir -p www/libs
          cp index.html www/index.html
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSL -o www/libs/pdf.min.js $B/pdf.js/3.11.174/pdf.min.js
          curl -fsSL -o www/libs/pdf.worker.min.js $B/pdf.js/3.11.174/pdf.worker.min.js
          curl -fsSL -o www/libs/mammoth.browser.min.js $B/mammoth/1.6.0/mammoth.browser.min.js
          curl -fsSL -o www/libs/jszip.min.js $B/jszip/3.10.1/jszip.min.js
          curl -fsSL -o www/libs/html2canvas.min.js $B/html2canvas/1.4.1/html2canvas.min.js
          python3 - <<'PY'
          import re
          s=open('www/index.html',encoding='utf-8').read()
          s=re.sub(r'https://cdnjs\.cloudflare\.com/ajax/libs/[^"\']*/([A-Za-z0-9.\-]+\.js)',r'libs/\1',s)
          open('www/index.html','w',encoding='utf-8').write(s)
          PY
      - name: Criar o projeto Android
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/share@7 @capacitor/filesystem@7
          npx cap init SoloNote com.solonote.app --web-dir www
          npx cap add android
          npx cap sync android
      - name: Icone do aplicativo
        run: |
          command -v convert || sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            convert icon.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            convert icon.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          sed -i 's/#FFFFFF/#070c1a/I' $R/values/ic_launcher_background.xml
      - name: Compilar o APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SoloNote-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
