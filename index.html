<style>
:root{--bg:#e4e8ec;--ui:#fff;--tx:#1d252c;--mut:#5d6b78;--ac:#368dfe;--ln:#cfd6dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px 'Public Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac)}
button.on{background:var(--ac);color:#fff}
header,nav{display:flex;align-items:center;gap:6px;background:var(--ui);padding:6px 10px;flex:none}
header{border-bottom:1px solid var(--ln)}
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--vb,0px));z-index:25;border-top:1px solid var(--ln);overflow-x:auto;transform:translateY(calc(100% + env(safe-area-inset-bottom,0px)));visibility:hidden}
body.tb-open nav{transform:none;visibility:visible}
#tg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--vb,0px));z-index:26;width:calc(64px*var(--s,1));height:calc(26px*var(--s,1));padding:0;line-height:1;font-size:calc(15px*var(--s,1));background:var(--ui);border:1px solid var(--ln);border-bottom:0;border-radius:12px 12px 0 0}
body.tb-open #tg{bottom:calc(var(--nh,52px) + env(safe-area-inset-bottom,0px) + var(--vb,0px))}
label.btn{display:inline-block;border:1px solid transparent;border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
label.btn:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.pick{font:inherit;max-width:100%;color:var(--mut)}
.pick::file-selector-button{font:600 15px 'Public Sans',sans-serif;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 22px;margin-right:12px;cursor:pointer}
#ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#pi{color:var(--mut);font-size:13px}
#sc{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y;overflow-anchor:none}
#doc{padding:12px 0 90px;display:flex;flex-direction:column;align-items:center;gap:14px;width:max-content;min-width:100%;box-sizing:border-box}
#empty{max-width:420px;margin:12vh auto 0;padding:0 20px;text-align:center;line-height:1.5}
#empty h1{font:600 24px 'Source Serif 4',serif;margin:0 0 8px}
#empty p{color:var(--mut);margin:0 0 18px}
#empty .big{background:var(--ac);color:#fff;padding:12px 22px;font-weight:600}
.pg{position:relative;background:#fff;color:#1b1b1b;width:780px;max-width:none;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.25);overflow:hidden}
.pg .base{display:block;width:100%;height:auto}
.rich{padding:48px 56px;font:17px/1.65 'Source Serif 4',Georgia,serif;overflow-wrap:anywhere}
.rich img{max-width:100%;height:auto}.rich table{border-collapse:collapse;max-width:100%}.rich td,.rich th{border:1px solid #bbb;padding:4px 8px}
.rich h1,.rich h2,.rich h3{line-height:1.25}
.slide{height:439px;box-sizing:border-box;padding:36px 48px;display:flex;flex-direction:column;justify-content:center;gap:8px;font:20px/1.4 'Public Sans',sans-serif;overflow:hidden}
.slide h2{font:600 32px/1.2 'Source Serif 4',serif;margin:0 0 10px}.slide p{margin:0}
.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
body[data-tool=pen] .ov,body[data-tool=erase] .ov{pointer-events:auto;touch-action:none}
body[data-tool=pen] .ov{cursor:crosshair}
body[data-tool=text] .pg{cursor:text}
.tbs{position:absolute;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;min-width:40px;outline:1px dashed transparent;font-family:'Public Sans',sans-serif}
body[data-tool=pen] .tb,body[data-tool=hl] .tb,body[data-tool=erase] .tb,body[data-tool=pen] .au,body[data-tool=hl] .au,body[data-tool=erase] .au{pointer-events:none}
.tb:focus-within,.tb:hover{outline-color:#368dfe}
.tb .tx{outline:none;padding:2px 4px;white-space:pre-wrap;min-height:1.2em}
.tb{--b:calc(40px*var(--s,1));--g:calc(var(--b)*-1.12);min-width:calc(var(--b)*4)}
.tb i{position:absolute;display:none;width:var(--b);height:var(--b);line-height:var(--b);text-align:center;color:#fff;font-style:normal;font-size:calc(var(--b)*.5);border-radius:10px;cursor:pointer;touch-action:none;outline:none;box-shadow:0 2px 6px rgba(0,0,0,.35);user-select:none;background:#368dfe}
.tb .mv{left:-6px;bottom:var(--g);cursor:move}.tb .rm{right:-6px;top:var(--g);background:#e03131}.tb .rt{left:-6px;top:var(--g);background:#2b9348}.tb .fz{position:absolute;right:-6px;bottom:var(--g);display:none;align-items:center;height:var(--b);background:#368dfe;color:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:calc(var(--b)*.4)}
.tb:focus-within .fz,.tb:hover .fz{display:flex}
.fz b{padding:0 8px;cursor:ew-resize;touch-action:none;user-select:none;line-height:var(--b)}
.fz input{width:calc(var(--b)*1.3);height:78%;box-sizing:border-box;border:0;border-radius:6px;margin-right:5px;text-align:center;font:inherit;color:#111;background:#fff}
header,nav,#top2{zoom:var(--s,1)}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.lh h2{margin:0!important}
.lh input,.gp input{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--ui);color:var(--tx);flex:1;min-width:0}
.lh button,.gp summary button{border-color:var(--ln)}
.gp{margin-bottom:10px}.gp summary{display:flex;align-items:center;gap:6px;padding:6px 2px;cursor:pointer;font-weight:600;list-style:none}.gp summary::-webkit-details-marker{display:none}
.gp .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gp .gc{color:var(--mut);font-weight:400}.gp .em{color:var(--mut);margin:4px}
.li .g{flex-direction:row;align-items:center;gap:12px}.cv{width:46px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--ln);flex:none;background:#fff}
.li .ti{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.rc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding:6px}.rc select{font:inherit;font-size:12px;max-width:110px;background:var(--ui);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.au{position:absolute;pointer-events:auto;width:280px;box-sizing:border-box;background:#fff;color:#1b1b1b;border:1px solid #c9d1d9;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.3);padding:5px;font:13px 'Public Sans',sans-serif}
.au .ah{display:flex;align-items:center;gap:6px}.au .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.au i{flex:none;width:calc(34px*var(--s,1));height:calc(34px*var(--s,1));line-height:calc(34px*var(--s,1));text-align:center;border-radius:8px;color:#fff;font-style:normal;cursor:pointer;touch-action:none;background:#368dfe}.au i.rm{background:#e03131}
.au audio{display:block;width:100%;margin-top:4px;height:calc(40px*var(--s,1))}
body:not(.has-doc) nav,body:not(.has-doc) #tg{display:none}
#ff{display:none;font:inherit;background:var(--ui);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;flex:none}body[data-tool=text] #ff{display:inline-block}
.textLayer{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;line-height:1}.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;transform-origin:0 0;cursor:text}.textLayer ::selection{background:rgba(47,111,237,.35)}
#lib{margin-top:22px;text-align:left}#lib h2{font:600 16px 'Source Serif 4',serif;margin:0 0 8px}

input{accent-color:var(--ac)}button{border-radius:10px}
